# Trak server with Docker Compose (Phase 5.6). This file is all a server
# needs: Docker builds the image right there, straight from the GitHub repo,
# at the latest release (the `stable` branch, which every release moves).
# Copy it to a folder on the server and, from it:
#
#   echo "TRAK_SERVER_TOKEN=$(openssl rand -hex 24)" > .env
#   mkdir trak-data && sudo chown 10001:10001 trak-data
#   docker compose up -d --build
#
# The chown matters: the server runs as uid 10001, and a folder Docker creates
# on its own belongs to root, so the server couldn't write to it.
#
# The token is what you type in the app to pair a device. To update to the
# latest release, run `docker compose up -d --build` again. To stay on one
# release instead, add e.g. TRAK_VERSION=v1.0.0-beta.2 to .env.
services:
  trak-server:
    build:
      context: https://github.com/Locardium/trak.git#${TRAK_VERSION:-stable}
      dockerfile: crates/server/Dockerfile
    image: trak-server:${TRAK_VERSION:-stable}
    restart: unless-stopped
    ports:
      - "7420:7420"
    environment:
      TRAK_SERVER_TOKEN: ${TRAK_SERVER_TOKEN:?set TRAK_SERVER_TOKEN}
    volumes:
      # config.toml, data/ (the database) and music/ (the files). Point it at
      # the big disk.
      - ./trak-data:/srv/trak
